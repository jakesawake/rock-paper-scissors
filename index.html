<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rock, Paper, Scissors!</title>
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="game-body">
      <div class="title">
        <h1>Rock, Paper, Scissors!</h1>
      </div>
      <div class="icons">
        <button class="rock" type="button">
          <img
            src="https://img.icons8.com/?size=100&id=4ZZatudpTru2&format=png&color=000000"
            alt="Icon of a rock"
          />
        </button>
        <button class="paper" type="button">
          <img
            src="https://img.icons8.com/?size=100&id=46726&format=png&color=000000"
            alt="Icon of paper"
          />
        </button>
        <button class="scissors" type="button">
          <img
            src="https://img.icons8.com/?size=100&id=67602&format=png&color=000000"
            alt="Icon of scissors"
          />
        </button>
      </div>
      <div class="start">Click a icon to Start!</div>
      <div class="results"></div>
      <div class="score"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
